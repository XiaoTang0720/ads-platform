services:
  db:
    # pgvector/pgvector is the official Postgres 16 image plus the vector extension (needed in week 9).
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ads}
      POSTGRES_DB: ${POSTGRES_DB:-ads}
      # Fails fast with this message if .env is missing the password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      # 127.0.0.1 = only this Mac can connect. A bare "5432:5432" would open it to the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
